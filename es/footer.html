<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Footer — IA Expo Internacional 2027</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
  /* ══════════════════════════════════════════════════════════
     VARIABLES GLOBALES — presentes en todas las páginas
  ══════════════════════════════════════════════════════════ */
  :root {
    --bg:       #030B1A;
    --border2:  rgba(255,255,255,0.07);
    --cyan:     #00E5FF;
    --text:     #E8F0FE;
    --muted:    #8EABD0;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ── FOOTER ── */
  footer {
    text-align: center; padding: 36px 20px;
    border-top: 1px solid var(--border2);
    color: var(--muted); font-size: 0.73rem; line-height: 1.9;
    position: relative; z-index: 1;
  }
  .footer-brand { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--cyan); letter-spacing: 0.05em; margin-bottom: 6px; }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--cyan); }
  .footer-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 20px; margin: 10px 0 14px; }
  </style>
</head>
<body>

<!-- ══ FOOTER ══ -->
<footer>
  <div class="footer-brand">IA EXPO INTERNACIONAL 2027</div>
  <div>"IA Para la Vida Real 2.0"</div>
  <div class="footer-links">
    <a href="https://iaExpo.ai/iaexpo">IA Expo</a>
    <a href="https://iaExpo.ai/programa">Programa</a>
    <a href="https://iaExpo.ai/tickets">Tickets</a>
    <a href="https://iaExpo.ai/convocatoria">Call for Papers</a>
    <a href="https://iaExpo.ai/patrocinios">Patrocinios</a>
    <a href="https://iaExpo.ai/info">Información</a>
  </div>

  <div>📅 28 · 29 · 30 Enero 2027 &nbsp;·&nbsp; 📍 Ciudad de México</div>
  <div style="margin-top:6px;">✉️ <a href="mailto:info@iaExpo.ai">info@iaExpo.ai</a> &nbsp;·&nbsp; 🌐 <a href="https://iaExpo.ai">iaExpo.ai</a></div>

  <div style="margin-top:14px;font-size:0.68rem;color:var(--muted);">© 2025-2026 IA Expo Internacional · Todos los derechos reservados · Ciudad de México, México</div>
</footer>
</body>
</html>
