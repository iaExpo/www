<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nav — IA Expo Internacional™ 2027</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
  :root {
    --bg:      #030B1A;
    --surface: rgba(13,110,253,0.07);
    --border:  rgba(0,229,255,0.15);
    --cyan:    #00E5FF;
    --blue:    #0D6EFD;
    --muted:   #8EABD0;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  /* ── NAV (desktop) ── */
  nav {
    position: sticky; top: 0; z-index: 300;
    background: rgba(3,11,26,0.97);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; height: 56px; gap: 12px;
  }

  /* Marca */
  .nav-brand {
    font-size: 0.75rem; font-weight: 800; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--cyan);
    text-decoration: none; white-space: nowrap; flex-shrink: 0;
  }

  /* Tabs desktop */
  .nav-tabs {
    display: flex; gap: 4px;
    flex-wrap: nowrap; overflow-x: auto;
    scrollbar-width: none;
  }
  .nav-tabs::-webkit-scrollbar { display: none; }

  .ntab {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 11px; border-radius: 8px;
    cursor: pointer; font-size: 0.72rem; font-weight: 600;
    font-family: inherit; transition: all 0.2s;
    white-space: nowrap; display: flex; align-items: center; gap: 5px;
    text-decoration: none;
  }
  .ntab .ico { font-size: 0.85rem; }
  .ntab:hover  { border-color: var(--cyan); color: var(--cyan); }
  .ntab.active {
    background: linear-gradient(135deg, var(--blue), #0A84FF);
    border-color: var(--blue); color: #fff;
  }

  /* ── HAMBURGER ── */
  .hamburger {
    display: none; flex-direction: column; gap: 5px;
    width: 38px; height: 38px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 9px; cursor: pointer;
    align-items: center; justify-content: center; flex-shrink: 0;
  }
  .hamburger span {
    display: block; width: 18px; height: 2px;
    background: var(--cyan); border-radius: 2px; transition: all 0.3s;
  }
  .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  /* ── MENÚ MÓVIL ── */
  .mobile-menu {
    display: none; flex-direction: column; gap: 6px;
    padding: 12px 20px 16px;
    background: rgba(3,11,26,0.99);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 56px; z-index: 299;
  }
  .mobile-menu.open { display: flex; }
  .mobile-menu .ntab {
    width: 100%; text-align: left;
    padding: 12px 14px; font-size: 0.88rem;
  }

  /* ── RESPONSIVE ── */
  /* Tablet y celular: ocultar tabs, mostrar hamburger */
  @media (max-width: 768px) {
    .nav-tabs   { display: none; }
    .hamburger  { display: flex; }
  }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════
     MENÚ DE NAVEGACIÓN — IA Expo Internacional™ 2027
     Uso: copiar <nav> y <div class="mobile-menu">
     en cada página. Ajustar .ntab.active según la
     página activa.
══════════════════════════════════════════ -->

<!-- NAV DESKTOP -->
<nav>
  <a href="https://iaExpo.ai" class="nav-brand">IA Expo™ 2027</a>

  <div class="nav-tabs">
    <a href="https://iaExpo.ai"                    class="ntab"><span class="ico">🌟</span> IA Expo</a>
    <a href="https://iaExpo.ai/programa"           class="ntab"><span class="ico">📅</span> Programa</a>
    <a href="https://iaExpo.ai/tickets"            class="ntab"><span class="ico">🎟️</span> Tickets</a>
    <a href="https://iaExpo.ai/convocatoria"       class="ntab"><span class="ico">📑</span> Call for Papers</a>
    <a href="https://iaExpo.ai/patrocinios.html"   class="ntab"><span class="ico">🏆</span> Patrocinios</a>
    <a href="https://iaExpo.ai/informacion"        class="ntab"><span class="ico">📍</span> Información</a>
  </div>

  <button class="hamburger" id="hbtn" onclick="toggleNav()" aria-label="Menú">
    <span></span><span></span><span></span>
  </button>
</nav>

<!-- MENÚ MÓVIL (tablet y celular) -->
<div class="mobile-menu" id="mmenu">
  <a href="https://iaExpo.ai"                class="ntab" onclick="closeNav()"><span class="ico">🌟</span> IA Expo</a>
  <a href="https://iaExpo.ai/programa"       class="ntab" onclick="closeNav()"><span class="ico">📅</span> Programa</a>
  <a href="https://iaExpo.ai/tickets"        class="ntab" onclick="closeNav()"><span class="ico">🎟️</span> Tickets</a>
  <a href="https://iaExpo.ai/convocatoria"   class="ntab" onclick="closeNav()"><span class="ico">📑</span> Call for Papers</a>
  <a href="https://iaExpo.ai/patrocinios"    class="ntab" onclick="closeNav()"><span class="ico">🏆</span> Patrocinios</a>
  <a href="https://iaExpo.ai/informacion"    class="ntab" onclick="closeNav()"><span class="ico">📍</span> Información</a>
</div>

<script>
function toggleNav() {
  document.getElementById('hbtn').classList.toggle('open');
  document.getElementById('mmenu').classList.toggle('open');
}
function closeNav() {
  document.getElementById('hbtn').classList.remove('open');
  document.getElementById('mmenu').classList.remove('open');
}
</script>

</body>
</html>
