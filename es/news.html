<style>
  .iab { --azul:#0b3d91; --acento:#00a6d6; --fondo:#f4f7fb; --borde:#dbe3ee; --texto:#1c2733;
         display:flex; height:85vh; min-height:520px; font-family:Arial,Helvetica,sans-serif;
         color:var(--texto); background:#fff; border:1px solid var(--borde); border-radius:10px; overflow:hidden; }
  .iab * { box-sizing:border-box; }
  .iab-menu { width:290px; flex:0 0 290px; background:var(--fondo); border-right:1px solid var(--borde);
              overflow-y:auto; padding:14px; }
  .iab-menu h2 { margin:0 0 12px; font-size:16px; color:var(--azul); letter-spacing:.5px; }
  .iab-menu details { margin-bottom:6px; background:#fff; border:1px solid var(--borde); border-radius:8px; }
  .iab-menu summary { cursor:pointer; padding:10px 12px; font-weight:bold; font-size:14px; color:var(--azul);
                      list-style:none; display:flex; justify-content:space-between; align-items:center; }
  .iab-menu summary::-webkit-details-marker { display:none; }
  .iab-menu summary::after { content:"+"; font-size:18px; color:var(--acento); }
  .iab-menu details[open] > summary::after { content:"–"; }
  .iab-menu details[open] > summary { border-bottom:1px solid var(--borde); }
  .iab-menu ul { list-style:none; margin:0; padding:6px; }
  .iab-menu li a { display:block; padding:8px 10px; font-size:13px; line-height:1.35; color:var(--texto);
                   text-decoration:none; border-radius:6px; }
  .iab-menu li a:hover { background:var(--fondo); }
  .iab-menu li a.activa { background:var(--azul); color:#fff; }
  .iab-visor { flex:1; min-width:0; background:#fff; }
  .iab-visor iframe { width:100%; height:100%; border:0; display:block; }
  @media (max-width:768px) {
    .iab { flex-direction:column; height:auto; }
    .iab-menu { width:100%; flex:none; max-height:40vh; border-right:0; border-bottom:1px solid var(--borde); }
    .iab-visor { height:80vh; }
  }
</style>

<div class="iab">
  <nav class="iab-menu" id="iab-menu" aria-label="Noticias por fecha">
    <h2>NOTICIAS DE IA</h2>
  </nav>
  <main class="iab-visor">
    <iframe id="iab-frame" title="Noticia" loading="lazy"></iframe>
  </main>
</div>

<script>
(function () {
  /* 1) TUS NOTICIAS  (fecha AAAA-MM-DD, título del submenú, URL del HTML) */
  var NOTICIAS = [
    { fecha:"2026-09-30", titulo:"Ejemplo: Nueva herramienta de IA para pequeñas empresas", url:"https://TU-DOMINIO.com/noticias/2026-09-30-a.html" },
    { fecha:"2026-09-30", titulo:"Ejemplo: IA que ayuda a diagnosticar más rápido",         url:"https://TU-DOMINIO.com/noticias/2026-09-30-b.html" },
    { fecha:"2026-09-29", titulo:"Ejemplo: Música creada con IA llega a las listas",        url:"https://TU-DOMINIO.com/noticias/2026-09-29-a.html" },
    { fecha:"2026-09-27", titulo:"Ejemplo: Video con IA para la vida real",                 url:"https://TU-DOMINIO.com/noticias/2026-09-27-a.html" }
  ];

  /* 2) LÓGICA */
  var MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  function fmt(iso) { var p = iso.split("-"); return p[2] + " " + MESES[parseInt(p[1],10)-1] + " " + p[0]; }

  var menu  = document.getElementById("iab-menu");
  var frame = document.getElementById("iab-frame");

  var grupos = {};
  NOTICIAS.forEach(function (n) { (grupos[n.fecha] = grupos[n.fecha] || []).push(n); });
  var fechas = Object.keys(grupos).sort().reverse();

  function abrir(a) {
    menu.querySelectorAll("a.activa").forEach(function (x) { x.classList.remove("activa"); });
    a.classList.add("activa");
    frame.src = a.getAttribute("data-url");
  }

  fechas.forEach(function (f, i) {
    var d = document.createElement("details");
    if (i === 0) d.open = true;
    var s = document.createElement("summary"); s.textContent = fmt(f);
    var ul = document.createElement("ul");
    grupos[f].forEach(function (n) {
      var li = document.createElement("li"), a = document.createElement("a");
      a.href = "#"; a.textContent = n.titulo; a.setAttribute("data-url", n.url);
      a.addEventListener("click", function (e) { e.preventDefault(); abrir(a); });
      li.appendChild(a); ul.appendChild(li);
    });
    d.appendChild(s); d.appendChild(ul); menu.appendChild(d);
  });

  var primera = menu.querySelector("li a");
  if (primera) abrir(primera);
})();
</script>
