<style>
  .iab { --azul:#0b3d91; --acento:#00a6d6; --fondo:#f4f7fb; --borde:#dbe3ee; --texto:#1c2733; --barra:56px;
         position:relative; display:flex; height:85vh; min-height:520px; font-family:Arial,Helvetica,sans-serif;
         color:var(--texto); background:#fff; border:1px solid var(--borde); border-radius:10px; overflow:hidden; }
  .iab * { box-sizing:border-box; }

  /* ---------- Menú lateral (escritorio) ---------- */
  .iab-menu { width:290px; flex:0 0 290px; background:var(--fondo); border-right:1px solid var(--borde);
              overflow-y:auto; padding:14px; -webkit-overflow-scrolling:touch; }
  .iab-inicio { display:inline-flex; align-items:center; gap:6px; margin:0 0 12px; padding:6px 10px; font-size:13px;
                 font-weight:bold; color:var(--azul); text-decoration:none; border:1px solid var(--borde); border-radius:20px; background:#fff; }
  .iab-inicio:hover { border-color:var(--acento); color:var(--acento); }
  .iab-casa { display:none; }
  .iab-menu h2 { margin:0 0 12px; font-size:16px; color:var(--azul); letter-spacing:.5px; }
  .iab-buscar { width:100%; margin:0 0 10px; padding:9px 12px; font-size:16px; font-family:inherit; color:var(--texto);
                border:1px solid var(--borde); border-radius:8px; background:#fff; outline:none; }
  .iab-buscar:focus { border-color:var(--acento); box-shadow:0 0 0 3px rgba(0,166,214,.18); }
  .iab-vacio { display:none; padding:8px 4px; font-size:13px; color:#6b7785; }
  .iab-menu details { margin-bottom:6px; background:#fff; border:1px solid var(--borde); border-radius:8px; }
  .iab-menu summary { cursor:pointer; padding:10px 12px; font-weight:bold; font-size:14px; color:var(--azul);
                      list-style:none; display:flex; align-items:center; gap:8px; }
  .iab-menu summary::-webkit-details-marker { display:none; }
  .iab-menu summary::after { content:"+"; font-size:18px; color:var(--acento); }
  .iab-menu details[open] > summary::after { content:"–"; }
  .iab-menu details[open] > summary { border-bottom:1px solid var(--borde); }
  .iab-num { margin-left:auto; font-size:11px; font-weight:bold; color:#5a6b80; background:var(--fondo);
             border-radius:10px; padding:2px 8px; }
  .iab-menu ul { list-style:none; margin:0; padding:6px; }
  .iab-menu li a { display:block; padding:8px 10px; font-size:13px; line-height:1.35; color:var(--texto);
                   text-decoration:none; border-radius:6px; }
  .iab-menu li a:hover { background:var(--fondo); }
  .iab-menu li a.activa { background:var(--azul); color:#fff; }

  /* ---------- Visor ---------- */
  .iab-visor { flex:1; min-width:0; background:#fff; }
  .iab-visor iframe { width:100%; height:100%; border:0; display:block; }

  /* ---------- Barra móvil (oculta en escritorio) ---------- */
  .iab-barra, .iab-velo { display:none; }

  /* ================= MÓVIL ================= */
  @media (max-width:768px) {
    .iab { flex-direction:column; height:auto; min-height:0; }

    .iab-barra { display:flex; align-items:center; gap:6px; height:var(--barra); flex:none; padding:0 6px;
                 background:var(--azul); color:#fff; position:relative; z-index:4; }
    .iab-hamb { flex:1; min-width:0; height:46px; display:flex; align-items:center; gap:12px; padding:0 8px;
                border:0; border-radius:8px; background:transparent; color:#fff; font-family:inherit;
                text-align:left; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .iab-hamb:active { background:rgba(255,255,255,.12); }
    .iab-ico { position:relative; flex:none; width:22px; height:2px; background:#fff; border-radius:2px; transition:background .2s; }
    .iab-ico::before, .iab-ico::after { content:""; position:absolute; left:0; width:22px; height:2px; background:#fff;
                                        border-radius:2px; transition:transform .25s, top .25s; }
    .iab-ico::before { top:-7px; } .iab-ico::after { top:7px; }
    .iab.abierto .iab-ico { background:transparent; }
    .iab.abierto .iab-ico::before { top:0; transform:rotate(45deg); }
    .iab.abierto .iab-ico::after  { top:0; transform:rotate(-45deg); }
    .iab-actual { flex:1; min-width:0; line-height:1.2; }
    .iab-actual small { display:block; font-size:11px; letter-spacing:.6px; text-transform:uppercase; opacity:.8; }
    .iab-actual b { display:block; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .iab-nav { flex:none; width:40px; height:40px; border:1px solid rgba(255,255,255,.35); border-radius:8px;
               background:transparent; color:#fff; font-size:22px; line-height:1; cursor:pointer; }
    .iab-nav:disabled { opacity:.3; cursor:default; }
    .iab-casa { display:flex; align-items:center; justify-content:center; flex:none; width:40px; height:40px;
                border:1px solid rgba(255,255,255,.35); border-radius:8px; color:#fff; }
    .iab-casa svg { width:20px; height:20px; }

    /* Cajón deslizable */
    .iab-menu { position:absolute; top:var(--barra); left:0; bottom:0; z-index:3; width:88%; max-width:360px; flex:none;
                border-right:1px solid var(--borde); box-shadow:6px 0 22px rgba(0,0,0,.18);
                transform:translateX(-105%); visibility:hidden; transition:transform .25s ease, visibility .25s; }
    .iab.abierto .iab-menu { transform:none; visibility:visible; }
    .iab-menu h2 { display:none; }
    .iab-buscar { position:sticky; top:-14px; z-index:1; }
    .iab-menu li a { padding:12px 10px; font-size:14px; }

    .iab-velo { display:block; position:absolute; top:var(--barra); left:0; right:0; bottom:0; z-index:2;
                background:rgba(10,20,40,.45); opacity:0; pointer-events:none; transition:opacity .25s; }
    .iab.abierto .iab-velo { opacity:1; pointer-events:auto; }

    .iab-visor { flex:none; height:78vh; height:calc(100svh - 130px); min-height:420px; }
  }
  @media (prefers-reduced-motion:reduce) { .iab * { transition:none !important; } }
</style>

  /* 2) LÓGICA (no es necesario modificar) */
  var MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  function fmt(iso) { var p = iso.split("-"); return p[2] + " " + MESES[parseInt(p[1],10)-1] + " " + p[0]; }
  function norm(t) { return String(t).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  function urlSegura(u) { return /%[0-9a-f]{2}/i.test(u) ? u : encodeURI(u); }

  var raiz   = document.getElementById("iab");
  var menu   = document.getElementById("iab-menu");
  var frame  = document.getElementById("iab-frame");
  var hamb   = document.getElementById("iab-hamb");
  var velo   = document.getElementById("iab-velo");
  var buscar = document.getElementById("iab-buscar");
  var vacio  = document.getElementById("iab-vacio");
  var bPrev  = document.getElementById("iab-prev");
  var bNext  = document.getElementById("iab-next");
  var txtF   = document.getElementById("iab-fecha");
  var txtT   = document.getElementById("iab-titulo");
  var movil  = window.matchMedia("(max-width:768px)");

  /* Agrupar por fecha (más reciente primero) y crear lista plana en el mismo orden */
  var grupos = {};
  NOTICIAS.forEach(function (n) { (grupos[n.fecha] = grupos[n.fecha] || []).push(n); });
  var fechas = Object.keys(grupos).sort().reverse();
  var orden = [], links = [], actual = -1;

  fechas.forEach(function (f, i) {
    var d = document.createElement("details");
    if (i === 0) d.open = true;
    var s = document.createElement("summary");
    s.appendChild(document.createTextNode(fmt(f)));
    var num = document.createElement("span"); num.className = "iab-num"; num.textContent = grupos[f].length;
    s.appendChild(num);
    var ul = document.createElement("ul");
    grupos[f].forEach(function (n) {
      var idx = orden.length; orden.push(n);
      var li = document.createElement("li"), a = document.createElement("a");
      a.href = "#"; a.textContent = n.titulo;
      a.setAttribute("data-busca", norm(n.titulo + " " + fmt(f) + " " + f));
      a.addEventListener("click", function (e) { e.preventDefault(); abrir(idx, { desplazar:true }); });
      links.push(a); li.appendChild(a); ul.appendChild(li);
    });
    d.appendChild(s); d.appendChild(ul); menu.appendChild(d);
  });

  /* Abrir / cerrar el cajón (móvil) */
  function abrirMenu() {
    raiz.classList.add("abierto");
    hamb.setAttribute("aria-expanded", "true");
    hamb.setAttribute("aria-label", "Cerrar lista de noticias");
    if (links[actual]) setTimeout(function () { links[actual].scrollIntoView({ block:"nearest" }); links[actual].focus({ preventScroll:true }); }, 260);
  }
  function cerrarMenu() {
    raiz.classList.remove("abierto");
    hamb.setAttribute("aria-expanded", "false");
    hamb.setAttribute("aria-label", "Abrir lista de noticias");
  }
  hamb.addEventListener("click", function () { raiz.classList.contains("abierto") ? cerrarMenu() : abrirMenu(); });
  velo.addEventListener("click", cerrarMenu);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && raiz.classList.contains("abierto")) { cerrarMenu(); hamb.focus(); } });
  (movil.addEventListener ? movil.addEventListener("change", cerrarMenu) : movil.addListener(cerrarMenu));

  /* Mostrar una noticia */
  function abrir(i, op) {
    op = op || {};
    var n = orden[i]; if (!n) return;
    actual = i;
    links.forEach(function (x) { x.classList.remove("activa"); x.removeAttribute("aria-current"); });
    links[i].classList.add("activa"); links[i].setAttribute("aria-current", "page");
    var det = links[i].closest("details"); if (det) det.open = true;
    frame.src = urlSegura(n.url);
    frame.title = n.titulo;
    txtF.textContent = fmt(n.fecha); txtT.textContent = n.titulo;
    bPrev.disabled = (i === 0); bNext.disabled = (i === orden.length - 1);
    if (movil.matches && buscar.value) { buscar.value = ""; filtrar(); }
    cerrarMenu();
    if (op.desplazar && movil.matches) {
      var top = raiz.getBoundingClientRect().top;
      if (top < 0 || top > window.innerHeight * 0.25) raiz.scrollIntoView({ behavior:"smooth", block:"start" });
    }
  }
  bPrev.addEventListener("click", function () { abrir(actual - 1); });
  bNext.addEventListener("click", function () { abrir(actual + 1); });

  /* Buscador */
  function filtrar() {
    var q = norm(buscar.value.trim()), total = 0;
    menu.querySelectorAll("details").forEach(function (d) {
      var vis = 0;
      d.querySelectorAll("li").forEach(function (li) {
        var ok = !q || li.firstChild.getAttribute("data-busca").indexOf(q) > -1;
        li.style.display = ok ? "" : "none"; if (ok) vis++;
      });
      d.style.display = vis ? "" : "none";
      d.open = q ? vis > 0 : (links[actual] && d.contains(links[actual]));
      total += vis;
    });
    vacio.style.display = total ? "none" : "block";
  }
  buscar.addEventListener("input", filtrar);

  /* Inicio: abrir la noticia más reciente */
  if (orden.length) abrir(0);
})();
</script>
